name: Build and Deploy Blog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build site (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

      - name: Deploy to theonewolf/theonewolf.github.io
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: theonewolf/theonewolf.github.io
          publish_branch: main
          publish_dir: ./site
          cname: www.theonewolf.com
          commit_message: "Deploy blog from theonewolf/blog@${{ github.sha }}"
