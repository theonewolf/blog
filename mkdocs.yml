site_name: Wolfgang Richter
site_url: https://www.theonewolf.com/
site_author: Wolfgang Richter
copyright: Copyright &copy; 2021 - 2026 Wolfgang Richter

theme:
  name: material
  logo: assets/wolf-logo.png
  favicon: assets/wolf-favicon.png
  font:
    text: Montserrat
    code: Source Code Pro
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - header.autohide
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.integrate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - meta
  - smarty
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - css/ffsem_demo.css

extra_javascript:
  - js/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - js/ffsem_demo.js

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/wolfgang-richter-b4730934/
    - icon: fontawesome/brands/github
      link: https://github.com/theonewolf
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/theonewolf
    - icon: fontawesome/brands/twitch
      link: https://twitch.tv/theonewolf87
    - icon: fontawesome/brands/flickr
      link: https://www.flickr.com/photos/29905928@N05/
    - icon: fontawesome/brands/reddit-alien
      link: https://www.reddit.com/user/theonewolf
